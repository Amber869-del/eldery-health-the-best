<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>長輩模式｜安心居</title>
<style>
:root{--ink:#102a43;--bg:#f5f9fc;--blue:#1261a0;--green:#087f5b;--orange:#d97706;--purple:#6b46c1;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}main{width:min(850px,100%);margin:auto;padding:16px 12px 40px}h1{text-align:center;font-size:clamp(2.3rem,8vw,4rem);margin:12px 0 4px}.sub{text-align:center;font-size:clamp(1.2rem,4vw,1.6rem);font-weight:bold;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mode{min-height:190px;border:0;border-radius:24px;padding:20px 12px;color:#fff;box-shadow:0 7px 0 #0002;cursor:pointer;font-size:clamp(1.35rem,4vw,2rem);font-weight:900}.mode small{display:block;font-size:1rem;margin-top:12px;font-weight:bold}.mode:focus-visible{outline:6px solid #ffd43b}.lower{background:var(--green)}.upper{background:var(--blue)}.medicine{background:var(--purple)}.food{background:var(--orange)}.safety{background:var(--red)}.home{background:#334e68;grid-column:1/-1}.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.tool{border:0;border-radius:14px;padding:15px;background:#52606d;color:#fff;font-size:1.15rem;font-weight:900}.tip{text-align:center;font-size:1.15rem;font-weight:bold;line-height:1.6;margin:20px 0 0}@media(max-width:560px){main{padding:10px 8px}.grid{grid-template-columns:1fr;gap:12px}.mode{min-height:125px;padding:14px}.home{grid-column:auto}.tools{grid-template-columns:1fr}.mode small{margin-top:5px}}
</style>
</head>
<body>
<main>
<h1>👴👵 長輩模式</h1>
<p class="sub">請選擇你現在要做的事情</p>
<section class="grid">
<button class="mode lower" onclick="go('elder-lower-limb-simple.html','下肢運動')">🦵<br>下肢運動<small>抬腳、做復健</small></button>
<button class="mode upper" onclick="go('elder-upper-limb-simple.html','上肢運動')">💪<br>上肢運動<small>手臂、肩膀運動</small></button>
<button class="mode medicine" onclick="go('elder-medication-simple.html','藥品辨識')">💊<br>藥品辨識<small>看這是什麼藥</small></button>
<button class="mode food" onclick="go('elder-food-medicine-simple.html','食品與期限')">📦<br>食品與期限<small>看食品、有效日期</small></button>
<button class="mode home" onclick="speak('這裡是長輩模式首頁。請選擇你現在要做的事情。')">🔊 再聽一次說明</button>
</section>
<div class="tools"><button class="tool" onclick="toggleVoice()" id="voiceBtn">🔊 語音教學：開</button><button class="tool" onclick="toggleFullscreen()">⛶ 全螢幕</button></div>
<p class="tip">只要按一個大按鈕，就會進入對應的簡單畫面。</p>
</main>
<script>
let voice=localStorage.getItem('elder_home_voice')!=='false';const voiceBtn=document.getElementById('voiceBtn');
function speak(t){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.58;speechSynthesis.speak(u)}
function go(file,label){speak(`現在進入${label}。`);setTimeout(()=>location.href=file,350)}
function toggleVoice(){voice=!voice;localStorage.setItem('elder_home_voice',String(voice));voiceBtn.textContent=voice?'🔊 語音教學：開':'🔇 語音教學：關';if(voice)speak('語音教學已開啟。')}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
voiceBtn.textContent=voice?'🔊 語音教學：開':'🔇 語音教學：關';setTimeout(()=>speak('歡迎來到長輩模式。請選擇你現在要做的事情。'),500);
</script>
</body>
</html>
