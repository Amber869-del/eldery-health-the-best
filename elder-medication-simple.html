<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長輩模式｜安心居智慧服藥</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <style>
        :root { --navy:#0b1120; --panel:#111827; --green:#059669; --red:#dc2626; --yellow:#facc15; }
        * { box-sizing:border-box; }
        html,body { min-height:100%; margin:0; }
        body { min-height:100vh; padding:18px; color:#f8fafc; background:#020617; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif; }
        .page { width:min(850px,100%); min-height:calc(100vh - 36px); margin:auto; }
        .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; margin-bottom:14px; background:rgba(15,23,42,.96); border:1px solid #1e293b; border-radius:20px; }
        h1 { margin:0; font-size:clamp(1.3rem,3vw,2rem); }
        .subtitle { margin:5px 0 0; color:#cbd5e1; font-size:1rem; }
        button { border:0; border-radius:14px; padding:16px 20px; color:#fff; font-size:clamp(1.05rem,2.5vw,1.35rem); font-weight:900; cursor:pointer; }
        button:focus-visible { outline:4px solid var(--yellow); }
        .voice,.fullscreen { background:#334155; font-size:1rem; padding:12px 15px; }
        .card { padding:20px; background:var(--panel); border:1px solid #334155; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,.25); }
        .camera-wrap { position:relative; overflow:hidden; min-height:420px; background:#000; border-radius:16px; border:2px solid #334155; }
        video { display:block; width:100%; min-height:420px; object-fit:cover; transform:scaleX(-1); }
        .camera-placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; color:#cbd5e1; background:rgba(15,23,42,.88); text-align:center; font-size:1.15rem; }
        .camera-placeholder.hidden { display:none; }
        .controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
        .camera-button { background:var(--green); }
        .camera-button.off { background:var(--red); }
        .scan-button { background:#f59e0b; color:#111827; }
        .result { margin-top:16px; padding:20px; color:#e2e8f0; background:#1e293b; border:2px solid #475569; border-radius:16px; font-size:clamp(1.1rem,2.5vw,1.45rem); line-height:1.8; }
        .result strong { color:#5eead4; }
        .medicine-name { color:#fef08a; font-size:clamp(1.6rem,4vw,2.4rem); font-weight:900; }
        .medicine-instruction { margin-top:12px; padding:14px; color:#111827; background:#fef08a; border-radius:12px; font-weight:800; }
        .take-section { display:none; margin-top:16px; }
        .take-section.active { display:block; }
        .take-title { margin:0 0 12px; color:#5eead4; font-size:clamp(1.3rem,3vw,1.8rem); }
        .take-buttons { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .taken { background:var(--green); }
        .not-taken { background:var(--red); }
        .status { min-height:1.6em; margin-top:14px; color:#cbd5e1; text-align:center; font-size:1.1rem; }
        .return { position:fixed; z-index:10; right:20px; bottom:20px; color:#14532d; background:var(--yellow); border:3px solid #14532d; font-size:1.1rem; }
        @media(max-width:650px) { body{padding:8px}.topbar{align-items:stretch;flex-direction:column}.topbar button{width:100%}.card{padding:12px}.camera-wrap,video{min-height:330px}.controls,.take-buttons{grid-template-columns:1fr}.return{right:12px;bottom:12px;left:12px;width:calc(100% - 24px)} }
    </style>
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div><h1>💊 安心居智慧服藥</h1><p class="subtitle">長輩模式｜看清楚、聽清楚、一步一步完成</p></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="voiceButton" class="voice" onclick="toggleVoice()">🔊 語音教學：開</button><button class="fullscreen" onclick="toggleFullscreen()">⛶ 全螢幕</button></div>
        </header>

        <section class="card">
            <div class="camera-wrap"><video id="medicineCamera" autoplay playsinline></video><div id="cameraPlaceholder" class="camera-placeholder">請先按「開啟鏡頭」，再把藥品正面對準鏡頭。</div></div>
            <div class="controls"><button id="cameraButton" class="camera-button" onclick="toggleCamera()">📷 開啟鏡頭</button><button class="scan-button" onclick="scanMedicine()">🔍 辨識這個藥</button></div>
            <div id="result" class="result">請把藥品放在鏡頭前，按下「辨識這個藥」。</div>
            <div id="takeSection" class="take-section">
                <h2 class="take-title">請告訴我今天有沒有吃藥</h2>
                <div class="take-buttons"><button class="taken" onclick="recordMedication('taken')">✅ 我已經吃藥</button><button class="not-taken" onclick="recordMedication('not_taken')">❌ 今天還沒吃</button></div>
            </div>
            <div id="status" class="status" aria-live="polite"></div>
        </section>
        <button class="return" onclick="goBack()">↩ 返回上一頁</button>
    </main>

    <script>
        const ROBOFLOW_API_KEY='U1owqHvk2R8Xfa2FfGe3', ROBOFLOW_MODEL='drug-vbidk', ROBOFLOW_VERSION='4', CONFIDENCE_THRESHOLD=.2;
        const drugInfoMap={
            medicine_a:{name:'希樂葆膠囊',purpose:'用於消炎、止痛、緩解關節炎與肌肉痠痛。'},
            drug:{name:'希樂葆膠囊',purpose:'用於消炎、止痛、緩解關節炎與肌肉痠痛。'},
            medicine_b:{name:'Brone-C',purpose:'用於緩解咳嗽、呼吸道不適與化痰。'},
            medicine_c:{name:'氧化鎂',purpose:'作為胃藥使用，能緩解胃酸過多或協助排便。'}
        };
        const firebaseConfig={apiKey:'AIzaSyAniUvKCNrI8uCF4-RgkTQkun-4ZkQ1CGg',authDomain:'heart-c720e.firebaseapp.com',databaseURL:'https://heart-c720e-default-rtdb.firebaseio.com',projectId:'heart-c720e',storageBucket:'heart-c720e.firebasestorage.app',messagingSenderId:'215297407903',appId:'1:215297407903:web:a8537d1e859f67b542dbaa',measurementId:'G-N68LPKKWE7'};
        firebase.initializeApp(firebaseConfig); const db=firebase.database();
        let stream=null, verifiedDrug=null, currentRecordKey=null, voiceEnabled=localStorage.getItem('medicine_voice_enabled')!=='false';
        const video=document.getElementById('medicineCamera');
        function speak(text){if(!voiceEnabled||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.6;speechSynthesis.speak(u);}
        function toggleVoice(){voiceEnabled=!voiceEnabled;localStorage.setItem('medicine_voice_enabled',String(voiceEnabled));if(!voiceEnabled&&'speechSynthesis'in window)speechSynthesis.cancel();updateVoice();if(voiceEnabled)speak('語音教學已開啟。');}
        function updateVoice(){document.getElementById('voiceButton').textContent=voiceEnabled?'🔊 語音教學：開':'🔇 語音教學：關';}
        async function toggleCamera(){const button=document.getElementById('cameraButton');if(!stream){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;document.getElementById('cameraPlaceholder').classList.add('hidden');button.textContent='關閉鏡頭';button.classList.add('off');speak('鏡頭已開啟，請把藥品正面對準鏡頭。');}catch(e){setStatus('相機啟動失敗，請允許瀏覽器使用相機。');speak('相機啟動失敗，請確認相機權限。');}}else{stream.getTracks().forEach(track=>track.stop());stream=null;video.srcObject=null;document.getElementById('cameraPlaceholder').classList.remove('hidden');button.textContent='📷 開啟鏡頭';button.classList.remove('off');speak('鏡頭已關閉。');}}
        async function scanMedicine(){if(!stream){speak('請先開啟鏡頭。');setStatus('請先開啟鏡頭。');return;}const result=document.getElementById('result');result.innerHTML='🔄 正在辨識，請保持藥品不動。';document.getElementById('takeSection').classList.remove('active');speak('正在辨識藥物，請保持穩定。');try{const canvas=document.createElement('canvas');canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);const base64=canvas.toDataURL('image/jpeg',.8).split(',')[1];const response=await fetch(`https://detect.roboflow.com/${ROBOFLOW_MODEL}/${ROBOFLOW_VERSION}?api_key=${ROBOFLOW_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:base64});const data=await response.json();if(data.predictions?.length&&data.predictions[0].confidence>=CONFIDENCE_THRESHOLD){const prediction=data.predictions[0],info=drugInfoMap[prediction.class]||{name:prediction.class,purpose:'一般日常保健或常備用藥。'};verifiedDrug={name:info.name,purpose:info.purpose,confidence:(prediction.confidence*100).toFixed(1)+'%'};result.innerHTML=`<div class="medicine-name">這是：${verifiedDrug.name}</div><div><strong>用途：</strong>${verifiedDrug.purpose}</div><div class="medicine-instruction">怎麼吃：請依照藥袋或醫師指示服用，不要自行增加、減少或更改劑量。</div>`;document.getElementById('takeSection').classList.add('active');currentRecordKey=db.ref('elderlyMedicineRecords').push().key;await db.ref(`elderlyMedicineRecords/${currentRecordKey}`).set({drugName:verifiedDrug.name,purpose:verifiedDrug.purpose,confidence:verifiedDrug.confidence,status:'pending',source:'elder-medication-simple',createdAt:firebase.database.ServerValue.TIMESTAMP});speak(`辨識成功。這是${verifiedDrug.name}。用途是${verifiedDrug.purpose}。吃法請依照藥袋或醫師指示，不要自行改變劑量。請選擇今天有沒有吃藥。`);}else{result.textContent='⚠️ 尚未能清楚辨識，請讓藥品正面完整對準鏡頭。';speak('尚未能清楚辨識，請把藥品正面對準鏡頭。');}}catch(e){console.error(e);result.textContent='❌ 辨識服務暫時無法使用，請稍後重試。';speak('辨識服務暫時無法使用，請稍後重試。');}}
        async function recordMedication(status){if(!verifiedDrug||!currentRecordKey){speak('請先完成藥品辨識。');return;}const label=status==='taken'?'已經吃藥':'今天還沒吃藥';try{await db.ref(`elderlyMedicineRecords/${currentRecordKey}`).update({status,medicationStatus:status,recordedAt:firebase.database.ServerValue.TIMESTAMP});setStatus(`已同步：${label}`);speak(`已記錄${label}，資料已同步到雲端。`);document.getElementById('takeSection').classList.remove('active');}catch(e){console.error(e);setStatus('資料同步失敗，請檢查網路連線。');speak('資料同步失敗，請稍後再試。');}}
        function resetMedicine(){verifiedDrug=null;currentRecordKey=null;document.getElementById('takeSection').classList.remove('active');document.getElementById('result').textContent='請把藥品放在鏡頭前，按下「辨識這個藥」。';}
        function goBack(){if(history.length>1){history.back();}else{speak('目前已經是第一頁。');setStatus('目前已經是第一頁。');}}
        function setStatus(text){document.getElementById('status').textContent=text;}
        function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
        updateVoice();
    </script>
<button onclick="location.href='elder-mode-home.html'" style="position:fixed;right:18px;bottom:18px;z-index:20;background:#facc15;color:#14532d;border:3px solid #14532d;border-radius:16px;padding:16px 20px;font-size:1.15rem;font-weight:900;cursor:pointer">↩ 返回長輩模式主畫面</button>
</body>
</html>
