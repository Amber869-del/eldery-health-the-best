<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長輩模式｜藥品與食品小幫手</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
:root{--blue:#1261a0;--green:#087f5b;--orange:#d97706;--red:#c62828;--ink:#102a43;--cream:#f7fbff}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif;font-size:20px}main{width:min(760px,100%);margin:auto;padding:16px 12px 90px}h1{font-size:clamp(2rem,7vw,3.1rem);text-align:center;margin:8px 0}.lead{text-align:center;font-size:1.25rem;font-weight:bold;margin:0 0 16px}.card{background:#fff;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 5px 18px #16324d1c}.camera{background:#07111b;border-radius:16px;overflow:hidden;position:relative}.camera video{display:block;width:100%;height:min(58vw,430px);min-height:280px;object-fit:cover;transform:scaleX(-1)}.placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:white;background:#142536e8}.placeholder.off{display:none}.step{padding:15px;border-left:8px solid var(--blue);background:#e8f3ff;border-radius:10px;font-size:1.25rem;font-weight:900;margin-bottom:14px}.step.warn{border-left-color:var(--orange);background:#fff5df}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}button{width:100%;border:0;border-radius:15px;padding:18px 14px;font-size:clamp(1.15rem,4vw,1.5rem);font-weight:900;color:#fff;cursor:pointer}button:focus-visible{outline:5px solid #ffd43b}.blue{background:var(--blue)}.orange{background:var(--orange)}.green{background:var(--green)}.gray{background:#52606d}.red{background:var(--red)}label{display:block;font-weight:900;margin-top:16px;margin-bottom:7px}input,select{width:100%;font-size:1.3rem;padding:14px;border:2px solid #9fb3c8;border-radius:12px;background:#fff}.result{font-size:1.35rem;line-height:1.8;padding:18px;background:#edf7f2;border:3px solid var(--green);border-radius:14px;min-height:80px}.big{font-size:clamp(1.8rem,7vw,3rem);font-weight:900;color:#075e46}.warning{margin-top:14px;padding:16px;background:#fff1f0;border:3px solid var(--red);border-radius:13px;font-size:1.35rem;font-weight:900;color:#9b1c1c}.notice{min-height:1.8em;text-align:center;font-weight:900;margin-top:14px}.hidden{display:none!important}.list{padding:0;list-style:none}.list li{padding:15px;border-radius:12px;background:#f0f4f8;margin:8px 0;font-size:1.12rem}.small{font-size:.95rem;color:#486581}@media(max-width:580px){main{padding:10px 8px 100px}.card{padding:14px}.buttons{grid-template-columns:1fr}.camera video{height:330px}.step{font-size:1.1rem}}
</style>
</head>
<body>
<main>
<h1>💊📦 藥品與食品小幫手</h1>
<p class="lead">一步一步做，我會用聲音告訴你</p>
<section class="card">
  <div id="step" class="step">第 1 步：請把藥品或食品正面對準鏡頭</div>
  <div class="camera"><video id="video" autoplay playsinline></video><div id="placeholder" class="placeholder">請按下方「開啟鏡頭」</div></div>
  <div class="buttons"><button id="cameraBtn" class="blue" onclick="toggleCamera()">📷 開啟鏡頭</button><button class="orange" onclick="scanFront()">🔍 辨識名稱</button></div>
</section>
<section id="confirmCard" class="card hidden">
  <div id="confirmStep" class="step warn">第 2 步：請確認這是什麼</div>
  <label for="itemName">藥品或食品名稱（看不清楚可以自己輸入）</label>
  <input id="itemName" placeholder="例如：血壓藥、巧克力、泡麵">
  <label for="kind">這是什麼</label>
  <select id="kind"><option value="medicine">藥品</option><option value="food">食品</option></select>
  <label for="expiry">有效期限</label>
  <input id="expiry" type="date">
  <p class="small">請把有效日期拍清楚；如果辨識錯誤，請直接改日期。</p>
  <button class="green" onclick="saveAndSpeak()">✅ 確認並告訴我</button>
</section>
<section id="resultCard" class="card hidden"><div id="result" class="result"></div><div id="healthWarning" class="warning hidden">⚠️ 這個食物可能太甜或太鹹，這個要少吃。</div><button class="blue" onclick="newScan()">🔄 再掃描一個</button></section>
<section class="card"><button id="voiceBtn" class="gray" onclick="toggleVoice()">🔊 語音教學：開</button><button class="gray" onclick="toggleFullscreen()">⛶ 全螢幕</button><p id="notice" class="notice"></p></section>
<section class="card"><h2>📋 最近記錄</h2><ul id="records" class="list"></ul></section>
</main>
<script>
const firebaseConfig={apiKey:'AIzaSyAniUvKCNrI8uCF4-RgkTQkun-4ZkQ1CGg',authDomain:'heart-c720e.firebaseapp.com',databaseURL:'https://heart-c720e-default-rtdb.firebaseio.com',projectId:'heart-c720e',storageBucket:'heart-c720e.firebasestorage.app',messagingSenderId:'215297407903',appId:'1:215297407903:web:a8537d1e859f67b542dbaa'};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const ROBOFLOW_API_KEY='U1owqHvk2R8Xfa2FfGe3',ROBOFLOW_MODEL='drug-vbidk',ROBOFLOW_VERSION='4';
const knownMedicineMap={medicine_a:'希樂葆膠囊',drug:'希樂葆膠囊',medicine_b:'Brone-C',medicine_c:'氧化鎂'};
const video=document.getElementById('video');let stream=null,frontText='',voice=localStorage.getItem('elder_scan_voice')!=='false';
const $=id=>document.getElementById(id);
function speak(text){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.58;u.pitch=1;speechSynthesis.speak(u)}
function toggleVoice(){voice=!voice;localStorage.setItem('elder_scan_voice',String(voice));$('voiceBtn').textContent=voice?'🔊 語音教學：開':'🔇 語音教學：關';if(voice)speak('語音教學已開啟。')}
function setNotice(t){$('notice').textContent=t}
async function toggleCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('placeholder').classList.remove('off');$('cameraBtn').textContent='📷 開啟鏡頭';speak('鏡頭已關閉。');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;$('placeholder').classList.add('off');$('cameraBtn').textContent='⏹ 關閉鏡頭';speak('鏡頭已開啟，請把藥品或食品正面對準。')}catch(e){setNotice('無法開啟鏡頭，請允許相機權限。');speak('無法開啟鏡頭，請檢查相機權限。')}}
async function scanFront(){if(!stream){setNotice('請先開啟鏡頭。');speak('請先開啟鏡頭。');return}setNotice('正在辨識中文名稱，請保持不動。');speak('正在辨識中文名稱，請保持不動。');const source=document.createElement('canvas');source.width=video.videoWidth||1280;source.height=video.videoHeight||720;source.getContext('2d').drawImage(video,0,0,source.width,source.height);const processed=document.createElement('canvas');processed.width=Math.min(source.width*1.5,2400);processed.height=Math.min(source.height*1.5,1600);const pctx=processed.getContext('2d');pctx.imageSmoothingEnabled=true;pctx.filter='contrast(1.25) brightness(1.08)';pctx.drawImage(source,0,0,processed.width,processed.height);try{const options={langPath:'https://tessdata.projectnaptha.com/4.0.0_best',logger:m=>{if(m.status==='recognizing text')setNotice('正在讀取中文名稱…')}};const r=await Tesseract.recognize(processed.toDataURL('image/jpeg',.92),'chi_tra+eng',options);frontText=r.data.text.replace(/[\u0000-\u001F]+/g,' ').replace(/\s+/g,' ').trim();const candidate=guessName(frontText);const confidence=Number(r.data.confidence||0);const reliable=confidence>=78&&isReliableName(candidate);$('itemName').value=reliable?candidate:'';$('confirmCard').classList.remove('hidden');$('step').textContent='第 2 步：請確認名稱，再輸入有效期限';setNotice(reliable?'已讀取到清楚文字，請確認名稱。':'沒有清楚讀到名稱，請直接輸入或重新拍攝。');speak(reliable?'已讀取到名稱，請確認畫面上的名稱。':'沒有清楚讀到名稱，請直接輸入藥品或食品名稱。')}catch(e){console.error(e);frontText='';$('itemName').value='';$('confirmCard').classList.remove('hidden');setNotice('中文辨識失敗，請直接輸入名稱。');speak('中文辨識失敗，請直接輸入名稱。')}}
function guessName(text){if(!text)return '';const lines=text.split(/[\n。.!！,，:：|]+/).map(x=>x.replace(/[»「」【】()（）]/g,'').replace(/\s+/g,'').trim()).filter(x=>x.length>=2);const bad=/^(有效|保存|製造|日期|成分|容量|重量|本品|請|注意|營養|熱量|expiry|bestbefore|mfg|exp)$/i;const candidate=lines.find(x=>!bad.test(x)&&/[\u4e00-\u9fffA-Za-z]/.test(x)&&!/^\d[\d./-]*$/.test(x));return (candidate||'').slice(0,80)}
function isReliableName(text){if(!text||text.length<2||text.length>40)return false;if(/[»「」【】]/.test(text))return false;const useful=(text.match(/[\u4e00-\u9fffA-Za-z0-9]/g)||[]).length;return useful/text.length>=.82}
function daysLeft(date){const today=new Date();today.setHours(0,0,0,0);const d=new Date(date+'T00:00:00');return Math.ceil((d-today)/86400000)}
function isTooMuch(name,text){const s=(name+' '+text).toLowerCase();return ['糖','甜','巧克力','糖果','餅乾','蛋糕','可樂','汽水','薯片','洋芋片','鹽','鹹','泡麵','salt','sugar','chocolate','candy','cookie','cola','chips','instant noodle'].some(k=>s.includes(k))}
async function saveAndSpeak(){const name=$('itemName').value.trim()||'未命名藥品或食品',kind=$('kind').value,date=$('expiry').value;if(!date){setNotice('請先填寫有效期限。');speak('請先填寫有效期限。');return}const left=daysLeft(date),label=kind==='medicine'?'藥品':'食品';let expiryText=left<0?'已經過期了':left===0?'今天到期':`還有 ${left} 天到期`;let warning=kind==='food'&&isTooMuch(name,frontText);$('result').innerHTML=`<div class="big">這是：${escapeHtml(name)}</div><div>${label}有效期限：<strong>${date.replaceAll('-','/')}</strong></div><div class="big">${expiryText}</div>${kind==='medicine'?'<div>吃法：請依照藥袋或醫師指示，不要自行改變劑量。</div>':''}`;$('healthWarning').classList.toggle('hidden',!warning);$('resultCard').classList.remove('hidden');$('confirmCard').classList.add('hidden');let speech=`這是${name}。${label}的有效期限是${date.replaceAll('-','/')}，${expiryText}。`;if(kind==='medicine')speech+='請依照藥袋或醫師指示服用，不要自行改變劑量。';if(warning)speech+='這個食物可能太甜或太鹹，這個要少吃。';speak(speech);setNotice('已完成辨識。');const record={name,kind,expiryDate:date,daysLeft:left,tooSweetOrSalty:warning,source:'elder-food-medicine-simple',createdAt:firebase.database.ServerValue.TIMESTAMP};try{await db.ref((kind==='medicine'?'elderlyMedicineRecords':'elderlyFoodRecords')).push(record);setNotice('已同步到雲端。')}catch(e){setNotice('畫面完成，但雲端同步失敗，請檢查網路。')}addRecord(record)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addRecord(r){const li=document.createElement('li');li.innerHTML=`<b>${escapeHtml(r.name)}</b><br>有效期限：${r.expiryDate.replaceAll('-','/')}｜${r.daysLeft<0?'已過期':`剩 ${r.daysLeft} 天`}${r.tooSweetOrSalty?'｜⚠️ 要少吃':''}`;$('records').prepend(li)}
function newScan(){$('resultCard').classList.add('hidden');$('confirmCard').classList.add('hidden');$('step').textContent='第 1 步：請把藥品或食品正面對準鏡頭';$('itemName').value='';$('expiry').value='';frontText='';setNotice('')}
async function detectKnownMedicine(imageData){try{const response=await fetch(`https://detect.roboflow.com/${ROBOFLOW_MODEL}/${ROBOFLOW_VERSION}?api_key=${ROBOFLOW_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:imageData.split(',')[1]});const data=await response.json();const best=(data.predictions||[]).sort((a,b)=>(b.confidence||0)-(a.confidence||0))[0];if(best&&best.confidence>=.55&&knownMedicineMap[best.class])return{name:knownMedicineMap[best.class],confidence:best.confidence};return null}catch(e){console.warn('drug model unavailable',e);return null}}
const ocrOnlyScan=scanFront;scanFront=async function(){if(!stream){return ocrOnlyScan()}setNotice('正在辨識藥品，請保持不動。');const c=document.createElement('canvas');c.width=video.videoWidth||1280;c.height=video.videoHeight||720;c.getContext('2d').drawImage(video,0,0,c.width,c.height);const detected=await detectKnownMedicine(c.toDataURL('image/jpeg',.9));if(detected){frontText=detected.name;$('itemName').value=detected.name;$('kind').value='medicine';$('confirmCard').classList.remove('hidden');$('step').textContent='第 2 步：已自動辨識藥品，請確認有效期限';setNotice('已自動辨識藥品，不需要打字。');speak(`已自動辨識，這是${detected.name}。請確認有效期限。`);return}return ocrOnlyScan()}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
$('voiceBtn').textContent=voice?'🔊 語音教學：開':'🔇 語音教學：關';speak('歡迎使用藥品與食品小幫手。請先按開啟鏡頭。');
</script>
<button onclick="location.href='elder-mode-home.html'" style="position:fixed;right:18px;bottom:18px;z-index:20;background:#facc15;color:#14532d;border:3px solid #14532d;border-radius:16px;padding:16px 20px;font-size:1.15rem;font-weight:900;cursor:pointer">↩ 返回長輩模式主畫面</button>
</body>
</html>
